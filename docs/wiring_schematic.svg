<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 800" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .grid { stroke: rgba(56, 189, 248, 0.08); stroke-width: 1; }
      .card-esp { fill: #0f172a; stroke: #00f3ff; stroke-width: 2.5; rx: 10; }
      .card-rx { fill: #0f172a; stroke: #a855f7; stroke-width: 2.5; rx: 10; }
      .card-mod { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.5; rx: 6; }
      .card-audio { fill: #1e1b4b; stroke: #818cf8; stroke-width: 1.5; rx: 6; }
      .card-servo { fill: #172554; stroke: #60a5fa; stroke-width: 1.5; rx: 6; }
      .card-lcd { fill: #14532d; stroke: #4ade80; stroke-width: 1.5; rx: 6; }
      .text-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #00f3ff; }
      .text-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; }
      .text-bold { font-family: 'Consolas', monospace; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .text-pin { font-family: 'Consolas', monospace; font-size: 11px; fill: #38bdf8; }
      .text-vcc { font-family: 'Consolas', monospace; font-size: 11px; fill: #ef4444; font-weight: 700; }
      .text-gnd { font-family: 'Consolas', monospace; font-size: 11px; fill: #94a3b8; font-weight: 700; }
      .wire-cyan { stroke: #00f3ff; stroke-width: 2.2; fill: none; }
      .wire-purple { stroke: #a855f7; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; }
      .wire-yellow { stroke: #eab308; stroke-width: 2.2; fill: none; }
      .wire-green { stroke: #22c55e; stroke-width: 2.2; fill: none; }
    </style>
  </defs>

  <rect width="1160" height="800" class="bg"/>
  <g class="grid">
    <path d="M 0,100 L 1160,100 M 0,200 L 1160,200 M 0,300 L 1160,300 M 0,400 L 1160,400 M 0,500 L 1160,500 M 0,600 L 1160,600 M 0,700 L 1160,700"/>
    <path d="M 100,0 L 100,800 M 200,0 L 200,800 M 300,0 L 300,800 M 400,0 L 400,800 M 500,0 L 500,800 M 600,0 L 600,800 M 700,0 L 700,800 M 800,0 L 800,800 M 900,0 L 900,800 M 1000,0 L 1000,800 M 1100,0 L 1100,800"/>
  </g>

  <text x="40" y="42" class="text-title">SKEMA VORTEX-X // ARSITEKTUR 2 ESP32 (TRANSMITTER &rarr; RECEIVER)</text>
  <text x="40" y="64" class="text-sub">Alur: Web Dashboard (Wi-Fi) &harr; ESP32 #1 Transmitter (I2S Audio + Sensor + OLED) &harr; ESP-NOW Nirkabel &harr; ESP32 #2 Receiver (4 Servo Bawah + LCD)</text>

  <!-- ESP32 #1 TRANSMITTER (LEFT HALF) -->
  <g transform="translate(40, 100)">
    <rect width="510" height="650" rx="12" fill="rgba(15,23,42,0.7)" stroke="#1e3a8a" stroke-width="2"/>
    <text x="255" y="30" class="text-bold" text-anchor="middle" fill="#00f3ff">ESP32 #1: TRANSMITTER (GATEWAY WEB + AUDIO + SENSOR)</text>

    <!-- ESP32 TX Core -->
    <g transform="translate(20, 60)">
      <rect width="200" height="330" class="card-esp"/>
      <text x="100" y="28" class="text-bold" text-anchor="middle" fill="#00f3ff">ESP32 TX DevKit</text>
      <text x="15" y="65" class="text-pin">GPIO 19 (D19) [PIR OUT]</text>
      <text x="15" y="95" class="text-pin">GPIO 18 (D18) [DHT11]</text>
      <text x="15" y="130" class="text-pin">GPIO 32 [MIC BCLK]</text>
      <text x="15" y="155" class="text-pin">GPIO 33 [MIC WS]</text>
      <text x="15" y="180" class="text-pin">GPIO 34 [MIC SD]</text>
      <text x="15" y="215" class="text-pin">GPIO 26 [SPK BCLK]</text>
      <text x="15" y="240" class="text-pin">GPIO 25 [SPK LRC]</text>
      <text x="15" y="265" class="text-pin">GPIO 22 [SPK DIN]</text>
      <text x="15" y="295" class="text-pin" fill="#4ade80">GPIO 21 [I2C SDA]</text>
      <text x="15" y="315" class="text-pin" fill="#4ade80">GPIO 23 [I2C SCL]</text>
    </g>

    <!-- TX Peripherals -->
    <g transform="translate(250, 60)">
      <rect width="235" height="80" class="card-mod"/>
      <text x="12" y="24" class="text-bold" fill="#fb7185">SENSOR PIR + DHT11</text>
      <text x="12" y="45" class="text-pin">PIR OUT &rarr; GPIO19 (VCC: 5V)</text>
      <text x="12" y="65" class="text-pin">DHT11 DATA &rarr; GPIO18 (VCC: 3V3)</text>
    </g>

    <g transform="translate(250, 155)">
      <rect width="235" height="95" class="card-audio"/>
      <text x="12" y="24" class="text-bold" fill="#818cf8">MIC I2S INMP441</text>
      <text x="12" y="45" class="text-pin">SCK/BCLK &rarr; G32 | WS &rarr; G33</text>
      <text x="12" y="65" class="text-pin">SD &rarr; G34 | L/R &rarr; GND (Mono)</text>
      <text x="12" y="83" class="text-sub">VCC wajib ke 3V3 ESP32</text>
    </g>

    <g transform="translate(250, 265)">
      <rect width="235" height="95" class="card-audio"/>
      <text x="12" y="24" class="text-bold" fill="#38bdf8">SPEAKER MAX98357A</text>
      <text x="12" y="45" class="text-pin">BCLK &rarr; G26 | LRC &rarr; G25</text>
      <text x="12" y="65" class="text-pin">DIN &rarr; G22 | GAIN &rarr; Default</text>
      <text x="12" y="83" class="text-vcc">VIN &rarr; 5V (V5/VIN ESP32)</text>
    </g>

    <g transform="translate(250, 375)">
      <rect width="235" height="95" class="card-lcd"/>
      <text x="12" y="24" class="text-bold" fill="#4ade80">OLED / LCD I2C BUS (TX)</text>
      <text x="12" y="45" class="text-pin">SDA &rarr; GPIO21 | SCL &rarr; GPIO23</text>
      <text x="12" y="65" class="text-sub">OLED (0x3C) &rarr; VCC 3V3</text>
      <text x="12" y="83" class="text-sub">LCD (0x27) &rarr; VCC 5V (opsional di TX)</text>
    </g>

    <g transform="translate(20, 490)">
      <rect width="465" height="130" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="232" y="28" class="text-bold" text-anchor="middle" fill="#00f3ff">ALUR KERJA TRANSMITTER</text>
      <text x="20" y="55" class="text-sub">1. Konek Wi-Fi Router ("pribadi") &amp; buka Web Server Port 80.</text>
      <text x="20" y="76" class="text-sub">2. Menerima perintah Dashboard: WAVE, STAND, REKAM, SPK, Slider.</text>
      <text x="20" y="97" class="text-sub">3. Merekam suara 3 detik via INMP441 &amp; memutar via MAX98357A.</text>
      <text x="20" y="118" class="text-sub">4. Memancarkan data sensor &amp; perintah ke Receiver via ESP-NOW.</text>
    </g>
  </g>

  <!-- ESP-NOW WIRELESS LINK ARROW -->
  <line x1="555" y1="240" x2="605" y2="240" class="wire-purple"/>
  <text x="580" y="220" class="text-bold" text-anchor="middle" fill="#c084fc">ESP-NOW</text>
  <text x="580" y="262" class="text-sub" text-anchor="middle">&lt; 5 ms</text>

  <!-- ESP32 #2 RECEIVER (RIGHT HALF) -->
  <g transform="translate(610, 100)">
    <rect width="510" height="650" rx="12" fill="rgba(15,23,42,0.7)" stroke="#6b21a8" stroke-width="2"/>
    <text x="255" y="30" class="text-bold" text-anchor="middle" fill="#d8b4fe">ESP32 #2: RECEIVER (4 SERVO BAWAH + LCD DATA)</text>

    <!-- ESP32 RX Core -->
    <g transform="translate(20, 60)">
      <rect width="200" height="290" class="card-rx"/>
      <text x="100" y="28" class="text-bold" text-anchor="middle" fill="#d8b4fe">ESP32 RX DevKit</text>
      <text x="15" y="68" class="text-pin">GPIO 13 (D13) [RL Servo]</text>
      <text x="15" y="103" class="text-pin">GPIO 14 (D14) [FL Servo]</text>
      <text x="15" y="138" class="text-pin">GPIO 18 (D18) [RR Servo]</text>
      <text x="15" y="173" class="text-pin">GPIO 21 (D21) [FR Servo]</text>
      <text x="15" y="218" class="text-pin" fill="#4ade80">GPIO 19 (D19) [LCD SDA]</text>
      <text x="15" y="248" class="text-pin" fill="#4ade80">GPIO 22 (D22) [LCD SCL]</text>
    </g>

    <!-- 4 Servos on Receiver -->
    <g transform="translate(245, 60)">
      <rect width="245" height="210" class="card-servo"/>
      <text x="122" y="26" class="text-bold" text-anchor="middle" fill="#93c5fd">4 SERVO BAWAH (MELAMBAI)</text>
      <text x="15" y="56" class="text-pin">[0] Belakang Kiri (RL) &rarr; G13</text>
      <text x="15" y="86" class="text-pin">[1] Depan Kiri (FL)    &rarr; G14</text>
      <text x="15" y="116" class="text-pin">[2] Belakang Kanan(RR) &rarr; G18</text>
      <text x="15" y="146" class="text-pin">[3] Depan Kanan (FR)   &rarr; G21</text>
      <text x="15" y="176" class="text-vcc">VCC Servo &rarr; PSU 5V Eksternal</text>
      <text x="15" y="196" class="text-gnd">GND Servo &harr; GND ESP32 RX</text>
    </g>

    <!-- LCD 16x2 on Receiver -->
    <g transform="translate(245, 285)">
      <rect width="245" height="105" class="card-lcd"/>
      <text x="122" y="26" class="text-bold" text-anchor="middle" fill="#86efac">LCD 16x2 I2C (RECEIVER)</text>
      <text x="15" y="50" class="text-pin">SDA &rarr; GPIO 19 (D19) (Bukan G21!)</text>
      <text x="15" y="70" class="text-pin">SCL &rarr; GPIO 22 (D22)</text>
      <text x="15" y="90" class="text-vcc">VCC &rarr; WAJIB 5V (VIN / BEC 5V)</text>
    </g>

    <g transform="translate(20, 490)">
      <rect width="465" height="130" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
      <text x="232" y="28" class="text-bold" text-anchor="middle" fill="#d8b4fe">ALUR KERJA RECEIVER</text>
      <text x="20" y="55" class="text-sub">1. Saat menyala tetap Mode RELAX (4 servo diam bebas getar).</text>
      <text x="20" y="76" class="text-sub">2. Otomatis mencari Channel Wi-Fi &amp; mengunci Transmitter.</text>
      <text x="20" y="97" class="text-sub">3. Menampilkan data Suhu, RH, PIR &amp; Mic di LCD &amp; Serial Monitor.</text>
      <text x="20" y="118" class="text-sub">4. Menggerakkan lambaian &amp; menyimpan kalibrasi tiap servo ke Flash.</text>
    </g>
  </g>
</svg>
